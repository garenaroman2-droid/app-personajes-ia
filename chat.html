<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat con Sofía</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #181818;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #292929;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .info h2 {
      margin: 0;
      font-size: 18px;
    }

    .info p {
      margin: 3px 0 0;
      color: #4ade80;
      font-size: 13px;
    }

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 13px;
      border-radius: 15px;
      font-size: 15px;
    }

    .sofia {
      align-self: flex-start;
      background: #252525;
    }

    .you {
      align-self: flex-end;
      background: #333;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #181818;
      border-top: 1px solid #292929;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background: #292929;
      color: white;
      outline: none;
    }

    button {
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      background: #4ade80;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <header>
    <div class="avatar">👩🏻</div>

    <div class="info">
      <h2>Sofía</h2>
      <p>● En línea</p>
    </div>
  </header>

  <div id="messages">

    <div class="message sofia">
      Hola 😊 ¿qué estás haciendo?
    </div>

  </div>

  <div class="input-area">
    <input id="messageInput" type="text" placeholder="Escribí un mensaje...">

    <button onclick="sendMessage()">➤</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text === "") return;

      const messages = document.getElementById("messages");

      const message = document.createElement("div");
      message.className = "message you";
      message.textContent = text;

      messages.appendChild(message);

      input.value = "";
      messages.scrollTop = messages.scrollHeight;

      setTimeout(() => {

  const reply = document.createElement("div");
  reply.className = "message sofia";

  const lower = text.toLowerCase();

  if (lower.includes("hola")) {
    reply.textContent = "Holaa 😏 ¿cómo estás?";
  }

  else if (lower.includes("qué hacés") || lower.includes("que haces")) {
    reply.textContent = "Acá tranqui, hablando con vos jajaja. ¿Vos qué hacés?";
  }

  else if (lower.includes("cómo estás") || lower.includes("como estas")) {
    reply.textContent = "Estoy bien 😌 ¿y vos?";
  }

  else if (lower.includes("nombre")) {
    reply.textContent = "Soy Sofía 😊";
  }

  else if (lower.includes("edad") || lower.includes("años")) {
    reply.textContent = "Tengo 20 años 😌";
  }

  else {
    reply.textContent = "Jajaja, contame más 👀";
  }

  messages.appendChild(reply);
  messages.scrollTop = messages.scrollHeight;

}, 1000);
    }
  </script>

</body>
</html>
